<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinic AI — Intelligent Support</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-light: #eef2ff;
            --accent: #8b5cf6;
            --gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --gradient-soft: linear-gradient(135deg, #eef2ff 0%, #faf5ff 100%);
            
            --bg-app: #fafbff;
            --bg-surface: #ffffff;
            
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --text-tertiary: #94a3b8;
            
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            
            --danger: #ef4444;
            
            --shadow-sm: 0 2px 4px rgba(15, 23, 42, 0.04), 0 1px 2px rgba(15, 23, 42, 0.03);
            --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.06), 0 2px 4px rgba(15, 23, 42, 0.04);
            --shadow-lg: 0 12px 32px rgba(99, 102, 241, 0.08), 0 4px 8px rgba(15, 23, 42, 0.04);
            --shadow-xl: 0 24px 48px rgba(99, 102, 241, 0.12), 0 8px 16px rgba(15, 23, 42, 0.06);
            
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none !important; }

        html, body {
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-app);
            color: var(--text-primary);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            letter-spacing: -0.011em;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            background: 
                radial-gradient(circle at 10% 20%, rgba(139, 92, 246, 0.04) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(99, 102, 241, 0.04) 0%, transparent 40%),
                var(--bg-app);
        }

        /* ─── TOP HEADER ──────────────────────────────── */
        .top-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px 24px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-light);
            z-index: 10;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            background: var(--gradient);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .brand-text h1 {
            font-size: 1.1rem;
            font-weight: 700;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .brand-text span {
            font-size: 0.7rem;
            color: var(--text-secondary);
            font-weight: 500;
            display: block;
            -webkit-text-fill-color: var(--text-secondary);
        }

        /* ─── MESSAGES ────────────────────────────────── */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            scroll-behavior: smooth;
            padding: 32px 0 24px;
        }

        .messages-container::-webkit-scrollbar { width: 8px; }
        .messages-container::-webkit-scrollbar-track { background: transparent; }
        .messages-container::-webkit-scrollbar-thumb { 
            background: rgba(99, 102, 241, 0.15);
            border-radius: 4px;
        }
        .messages-container::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.3); }

        .messages-wrapper {
            max-width: 820px;
            margin: 0 auto;
            padding: 0 28px;
        }

        /* ─── EMPTY STATE ─────────────────────────────── */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 24px;
            text-align: center;
            animation: fadeInUp 0.6s var(--ease-out);
        }

        .empty-icon {
            width: 88px;
            height: 88px;
            background: var(--gradient);
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            margin-bottom: 24px;
            box-shadow: 0 16px 40px rgba(99, 102, 241, 0.3);
            position: relative;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .empty-icon::before {
            content: '';
            position: absolute;
            inset: -4px;
            background: var(--gradient);
            border-radius: 32px;
            opacity: 0.2;
            z-index: -1;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 0.35; transform: scale(1.05); }
        }

        .empty-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            letter-spacing: -0.03em;
        }

        .empty-subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 32px;
            max-width: 400px;
        }

        .suggestions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
            width: 100%;
            max-width: 640px;
        }

        .suggestion-card {
            padding: 16px 18px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            cursor: pointer;
            transition: all 0.25s var(--ease-out);
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.875rem;
            color: var(--text-primary);
        }

        .suggestion-card:hover {
            border-color: var(--primary);
            background: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .suggestion-icon {
            width: 36px;
            height: 36px;
            background: var(--primary-light);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            flex-shrink: 0;
            transition: all 0.25s;
        }

        .suggestion-card:hover .suggestion-icon {
            background: var(--gradient);
            color: white;
        }

        /* ─── MESSAGE BUBBLES ─────────────────────────── */
        .message-row {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            animation: msgIn 0.4s var(--ease-out) forwards;
            opacity: 0;
            transform: translateY(12px);
        }

        .message-row.user { flex-direction: row-reverse; }

        @keyframes msgIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-weight: 600;
            font-size: 0.875rem;
            box-shadow: var(--shadow-sm);
        }

        .avatar.ai { background: var(--gradient); color: white; }
        .avatar.user { background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%); color: var(--text-primary); }

        .message-content {
            max-width: 70%;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .message-row.user .message-content { align-items: flex-end; }

        .bubble {
            padding: 14px 18px;
            line-height: 1.6;
            font-size: 0.95rem;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .user .bubble {
            background: var(--gradient);
            color: white;
            border-radius: 20px 20px 4px 20px;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
        }

        .ai .bubble {
            background: var(--bg-surface);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: 20px 20px 20px 4px;
            box-shadow: var(--shadow-sm);
        }

        /* ─── TYPING INDICATOR ─────────────────────────── */
        .typing-indicator {
            display: none;
            max-width: 820px;
            margin: 0 auto;
            padding: 0 28px;
            margin-bottom: 20px;
        }

        .typing-row { display: flex; gap: 12px; }

        .typing-bubble {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 14px 18px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 20px 20px 20px 4px;
            box-shadow: var(--shadow-sm);
        }

        .typing-dot {
            width: 7px;
            height: 7px;
            background: var(--primary);
            border-radius: 50%;
            animation: typingBounce 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes typingBounce {
            0%, 80%, 100% { transform: scale(0.5); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* ─── INPUT AREA ───────────────────────────────── */
        .input-area {
            padding: 20px 28px 28px;
            position: relative;
            display: flex;
            justify-content: center;
            background: linear-gradient(to top, var(--bg-app) 70%, transparent);
        }

        .input-area::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, var(--bg-app) 40%, transparent);
            pointer-events: none;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            width: 100%;
            max-width: 820px;
            background: var(--bg-surface);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 10px 10px 10px 22px;
            box-shadow: var(--shadow-lg);
            transition: all 0.3s var(--ease-out);
            z-index: 1;
        }

        .input-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: var(--shadow-xl), 0 0 0 4px rgba(99, 102, 241, 0.08);
            transform: translateY(-2px);
        }

        #messageInput {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.95rem;
            resize: none;
            max-height: 150px;
            padding: 10px 0;
            line-height: 1.5;
        }

        #messageInput::placeholder { color: var(--text-tertiary); font-weight: 400; }

        #sendBtn {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-md);
            border: none;
            background: var(--gradient);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.25s var(--ease-bounce);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        #sendBtn:hover:not(:disabled) {
            transform: scale(1.08) rotate(-5deg);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
        }
        #sendBtn:active:not(:disabled) { transform: scale(0.95); }
        #sendBtn:disabled { background: var(--border); cursor: not-allowed; box-shadow: none; transform: none; }

        .error-bubble {
            background: #fef2f2 !important;
            color: #b91c1c !important;
            border-color: #fecaca !important;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ─── RESPONSIVE ───────────────────────────────── */
        @media (max-width: 768px) {
            .messages-wrapper { padding: 0 16px; }
            .messages-container { padding: 20px 0; }
            .input-area { padding: 12px 16px 20px; }
            .bubble { font-size: 0.9rem; padding: 12px 16px; }
            .message-content { max-width: 82%; }
            .avatar { width: 32px; height: 32px; }
            .empty-title { font-size: 1.4rem; }
            .empty-subtitle { font-size: 0.9rem; }
            .suggestions { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Top Header -->
        <header class="top-header">
            <div class="brand-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"/>
                </svg>
            </div>
            <div class="brand-text">
                <h1>Clinic AI</h1>
                <span>Intelligent Support</span>
            </div>
        </header>

        <!-- Messages -->
        <div class="messages-container" id="messagesContainer">
            <div class="messages-wrapper" id="messagesWrapper">
                <div class="empty-state" id="emptyState">
                    <div class="empty-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"/>
                        </svg>
                    </div>
                    <h2 class="empty-title">How can I help you today?</h2>
                    <p class="empty-subtitle">Ask me anything — I'm here to assist you with quick, intelligent answers.</p>
                    <div class="suggestions">
                        <button class="suggestion-card" data-prompt="What services do you offer?">
                            <div class="suggestion-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                            </div>
                            <span>What services do you offer?</span>
                        </button>
                        <button class="suggestion-card" data-prompt="How can I book an appointment?">
                            <div class="suggestion-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                            </div>
                            <span>How can I book an appointment?</span>
                        </button>
                        <button class="suggestion-card" data-prompt="Tell me about your pricing.">
                            <div class="suggestion-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                            </div>
                            <span>Tell me about your pricing</span>
                        </button>
                        <button class="suggestion-card" data-prompt="What are your opening hours?">
                            <div class="suggestion-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                            </div>
                            <span>What are your opening hours?</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Typing Indicator -->
        <div class="typing-indicator" id="typingIndicator">
            <div class="typing-row">
                <div class="avatar ai">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"/></svg>
                </div>
                <div class="typing-bubble">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            </div>
        </div>

        <!-- Input -->
        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="messageInput" placeholder="Ask anything..." rows="1"></textarea>
                <button id="sendBtn" aria-label="Send message">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M15.854.146a.5.5 0 0 1 .11.54l-5.819 14.547a.75.75 0 0 1-1.329.124l-3.178-4.995L.643 7.184a.75.75 0 0 1 .124-1.33L15.314.037a.5.5 0 0 1 .54.11ZM6.636 10.07l2.761 4.338L14.13 2.576 6.636 10.07Zm6.787-8.201L1.591 6.602l4.339 2.76 7.494-7.493Z"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const messagesContainer = document.getElementById('messagesContainer');
        const messagesWrapper = document.getElementById('messagesWrapper');
        const typingIndicator = document.getElementById('typingIndicator');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const emptyState = document.getElementById('emptyState');

        // Suggestion cards
        document.querySelectorAll('.suggestion-card').forEach(card => {
            card.addEventListener('click', () => {
                messageInput.value = card.dataset.prompt;
                messageInput.focus();
                messageInput.dispatchEvent(new Event('input'));
            });
        });

        // API helper (no auth)
        async function apiCall(endpoint, options = {}) {
            const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
            const response = await fetch(endpoint, { ...options, headers });
            if (!response.ok) {
                const errData = await response.json().catch(() => ({}));
                throw new Error(errData.detail || `Server error (${response.status})`);
            }
            return response.json();
        }

        function showEmptyState() {
            if (emptyState && !messagesWrapper.querySelector('.message-row')) {
                emptyState.style.display = 'flex';
            }
        }
        function hideEmptyState() {
            if (emptyState) emptyState.style.display = 'none';
        }

        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 150) + 'px';
        });

        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });

        sendBtn.addEventListener('click', sendMessage);

        function scrollToBottom() { 
            messagesContainer.scrollTop = messagesContainer.scrollHeight; 
        }

        function addMessage(text, sender) {
            hideEmptyState();
            const row = document.createElement('div');
            row.className = `message-row ${sender}`;

            const avatar = document.createElement('div');
            avatar.className = `avatar ${sender}`;
            if (sender === 'ai') {
                avatar.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"/></svg>';
            } else {
                avatar.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
            }

            const content = document.createElement('div');
            content.className = 'message-content';

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = text;

            content.appendChild(bubble);
            row.appendChild(avatar);
            row.appendChild(content);
            messagesWrapper.appendChild(row);
            scrollToBottom();
        }

        function showError(message) {
            hideEmptyState();
            const row = document.createElement('div');
            row.className = 'message-row ai';

            const avatar = document.createElement('div');
            avatar.className = 'avatar ai';
            avatar.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"/></svg>';

            const content = document.createElement('div');
            content.className = 'message-content';

            const bubble = document.createElement('div');
            bubble.className = 'bubble error-bubble';
            bubble.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/></svg><span>⚠️ ${message}</span>`;

            content.appendChild(bubble);
            row.appendChild(avatar);
            row.appendChild(content);
            messagesWrapper.appendChild(row);
            scrollToBottom();
        }

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            messageInput.value = '';
            messageInput.style.height = 'auto';
            sendBtn.disabled = true;
            messageInput.disabled = true;
            typingIndicator.style.display = 'block';
            scrollToBottom();

            try {
                const data = await apiCall('/api/send', {
                    method: 'POST',
                    body: JSON.stringify({ message: text })
                });
                addMessage(data.response, 'ai');
            } catch (error) {
                showError(error.message || 'Failed to get response. Please try again.');
            } finally {
                typingIndicator.style.display = 'none';
                sendBtn.disabled = false;
                messageInput.disabled = false;
                messageInput.focus();
                scrollToBottom();
            }
        }

        messageInput.focus();
    </script>
</body>
</html>
